# Continuous Integration: every push and pull request is checked automatically.
# If anything fails, GitHub shows a red ✗ and the change shouldn't be merged.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run for the same branch when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Principle of least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  check:
    name: Format · Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real PostgreSQL for integration tests, started fresh for every run.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ledgerly
          POSTGRES_PASSWORD: ledgerly
          POSTGRES_DB: ledgerly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerly"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://ledgerly:ledgerly@localhost:5432/ledgerly_test
      TEST_DATABASE_URL: postgres://ledgerly:ledgerly@localhost:5432/ledgerly_test
      API_TEST_DATABASE_URL: postgres://ledgerly:ledgerly@localhost:5432/ledgerly_api_test
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile: fail if pnpm-lock.yaml is out of date, so CI installs
      # exactly the dependency versions that were tested locally.
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      # The service container creates one database; the API's tests need a second.
      - name: Create the API test database
        run: psql "postgres://ledgerly:ledgerly@localhost:5432/ledgerly_test" -c "create database ledgerly_api_test"

      # If someone changed schema.ts but forgot to generate a migration, the
      # generator would create a new file here — and `git diff` fails the build.
      - name: Migrations are in sync with the schema
        run: |
          pnpm --filter @ledgerly/db exec drizzle-kit check
          pnpm db:generate
          git add -N packages/db/migrations
          git diff --exit-code packages/db/migrations

      # test:coverage runs every unit and integration test AND enforces each
      # package's coverage ratchet (vitest.config.ts → coverage.thresholds).
      - run: pnpm turbo run lint typecheck test:coverage build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ledgerly
          POSTGRES_PASSWORD: ledgerly
          POSTGRES_DB: ledgerly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerly"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The browser binary is ~150 MB: cache it, keyed by the exact Playwright version.
      - name: Cache Playwright's browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ledgerly/e2e exec playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @ledgerly/e2e exec playwright install-deps chromium

      # Builds the API and an e2e build of the web app, starts API + worker + web
      # on a fresh database, and runs every journey (CI=true: 2 retries, traces).
      - run: pnpm e2e

      # On failure, keep the HTML report: screenshots, and a step-by-step trace
      # of every retried test (open with `npx playwright show-trace`).
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  security:
    name: Dependency audit · Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so the secret scan sees every commit

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Known vulnerabilities in the packages we ship (A06: vulnerable components).
      - run: pnpm audit --prod --audit-level=high

      # Leaked API keys, passwords and tokens anywhere in the git history.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
